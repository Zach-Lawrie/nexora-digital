<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALL · Africa Local Leagues</title>
<meta name="description" content="ALL, Africa Local Leagues. African sports fixtures, live scores, standings, squads and news for leagues and tournaments across Africa, in every sport.">
<meta name="theme-color" content="#060a18">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="ALL · Africa Local Leagues">
<meta property="og:description" content="African sports: fixtures, live scores, standings and news for local leagues in every sport.">
<meta property="og:image" content="/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a midnight stadium. One column, cinematic banners with a woven diamond motif, scoreboards first, five-tab bar below.
   The management portal swaps to a flatter charcoal palette so staff always know which side they are on. */
:root{
  color-scheme:dark;
  --bg:#060a18; --panel:#0e1530; --panel2:#172046; --line:#242e5a;
  --ink:#ffffff; --muted:#93a0c9; --blue:#2f7bff; --gold:#f5b833;
  --live:#ff4d4d; --win:#3ddc97; --loss:#ff7a7a;
  --display:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body.mg{--bg:#0b0c0f; --panel:#15171c; --panel2:#1f2229; --line:#2d313b; --muted:#9aa1ad}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
header.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.word{font:400 30px/1 var(--display);letter-spacing:.04em}
.word b{color:var(--gold);font-weight:400}
.badge{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.ib{background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.mode{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
#view{flex:1;overflow-y:auto;padding:16px 16px 28px}
#main{display:flex;flex-direction:column;gap:18px}
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--panel)}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 10px;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;border-top:2px solid transparent;min-width:0}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--ink);border-top-color:var(--gold)}
body.mg nav.tabs button[aria-current="true"]{border-top-color:var(--blue)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.03em;line-height:1}
h1{font-size:46px}
h2{font-size:24px;color:var(--ink)}
.sub{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{background:var(--gold);color:#1a1300;border:0;border-radius:10px;padding:11px 16px;font:700 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--loss);border:1px solid var(--loss)}
.btn.sm{padding:8px 11px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--muted)}
.chip.gold{color:var(--gold)}
.chip.live{background:var(--live);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%;display:block;color:inherit}
button.card:hover{border-color:var(--blue)}
.name{font:400 26px/1 var(--display);letter-spacing:.03em;overflow-wrap:anywhere}
.name.sm{font-size:21px}
.crest{flex:none;object-fit:contain;border-radius:8px}
.scroller{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.scroller>*{flex:0 0 220px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;color:inherit;min-width:0}
.tile b{font:400 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tile .tn{font:600 15px/1.2 var(--body);color:var(--ink)}
/* banner */
.banner{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:linear-gradient(150deg,#16245c,#070b1d 70%);padding:18px 16px;display:flex;flex-direction:column;gap:10px;min-height:190px;justify-content:flex-end}
.banner::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(45deg,rgba(245,184,51,.09) 0 2px,transparent 2px 22px),
  repeating-linear-gradient(-45deg,rgba(245,184,51,.09) 0 2px,transparent 2px 22px);
  -webkit-mask-image:linear-gradient(200deg,#000,transparent 65%);mask-image:linear-gradient(200deg,#000,transparent 65%)}
.banner img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner.photo::before{background:linear-gradient(0deg,rgba(4,7,20,.96) 10%,rgba(4,7,20,.35) 70%);-webkit-mask-image:none;mask-image:none;z-index:1}
.banner>*:not(.bg){position:relative;z-index:2}
.banner .accent{position:absolute;left:0;top:0;bottom:0;width:4px;z-index:3}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;background:none;border:0;color:inherit;padding:0}
.side .tn{font:400 21px/1 var(--display);letter-spacing:.03em;overflow-wrap:anywhere}
.score{font:400 56px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.score.sm{font-size:30px;color:var(--gold)}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mrow .t{display:flex;align-items:center;gap:8px;min-width:0;font:600 14px/1.15 var(--body)}
.mrow .t span{overflow-wrap:anywhere}
.mrow .t.r{flex-direction:row-reverse;text-align:right}
.mrow .t.w{color:var(--gold)}
.mrow .s{font:400 22px/1 var(--display);font-variant-numeric:tabular-nums;background:var(--bg);border-radius:8px;padding:7px 10px 5px;white-space:nowrap;letter-spacing:.03em}
.when{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.win{color:var(--gold);font-weight:600;font-size:14px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 5px;text-align:center;font-size:14px;white-space:nowrap}
th{font:700 11px/1 var(--body);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line)}
td.tm,th.tm{text-align:left;white-space:normal}
td.tm{min-width:104px}
td.tm button{background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;text-align:left;font:600 14px/1.15 var(--body);color:inherit}
tr+tr td{border-top:1px solid var(--line)}
td.pts{font-weight:700;color:var(--gold)}
.lead tbody tr:first-child td:first-child{box-shadow:inset 3px 0 var(--gold)}
.pl{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;text-align:left;color:inherit}
.num{flex:none;min-width:36px;height:36px;padding:0 6px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font:400 22px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.pl .pn{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.pp{color:var(--muted);font-size:13px}
.form5{display:flex;gap:4px}
.form5 i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 11px/1 var(--body);font-style:normal;background:var(--panel2);color:var(--muted)}
.form5 i.W{background:var(--win);color:#04281a}.form5 i.L{background:var(--loss);color:#3a0606}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1 0 auto;background:none;border:0;border-radius:7px;padding:9px 11px;font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1300}
body.mg .seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.tl{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:start;font-size:14px}
.tl .mi{font:400 20px/1 var(--display);color:var(--gold);text-align:right}
.art p{margin:0 0 12px;max-width:65ch}
.art img{max-width:100%;border-radius:14px;display:block}
.stepper{display:flex;align-items:center;gap:8px;justify-content:center}
.stepper button{width:44px;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:22px}
#ncount{position:absolute;top:-5px;right:-5px;background:var(--live);color:#fff;border-radius:9px;font:700 11px/1 var(--body);padding:3px 5px}#ncount:empty{display:none}
/* slider */
.slider{display:flex;flex-direction:column;gap:8px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;overflow:hidden;min-height:224px;padding:18px 16px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(150deg,var(--sg,#16245c),#070b1d 72%)}
.slide img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,7,20,.95) 15%,rgba(4,7,20,.25) 75%);z-index:1}
.slide>*:not(.bg){position:relative;z-index:2}
.slide .st{font:400 32px/1 var(--display);letter-spacing:.03em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.slide .sx{color:var(--muted);font-size:14px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:60ch}
.slide.alert{--sg:#5a1020}.slide.advert{--sg:#4a3a0c}.slide.announcement{--sg:#0f2f6b}.slide.ext{--sg:#1b2333}
a.btn{text-decoration:none;display:inline-block}
.dots{display:flex;gap:6px;justify-content:center}
.dots button{width:8px;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);transition:width .2s}
.dots button[aria-current="true"]{width:22px;background:var(--gold)}
.src{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.12);padding:5px 8px;border-radius:6px}
#q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;width:100%}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(2,4,12,.76);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden]{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:90%;display:flex;flex-direction:column}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel>.hd h3{font-size:26px;overflow-wrap:anywhere}
.panel>.bd{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);padding:4px 8px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%}
label.f input[type=color]{padding:4px;height:46px}
label.f textarea{min-height:130px;resize:vertical}
label.c{display:flex;gap:10px;align-items:flex-start;font-size:15px}
label.c input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--loss);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#fff;color:#0b1026;padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:9;font-weight:500}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.card,.pl,.tile{transition:border-color .15s}.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.25}}}
@media (max-width:380px){h1{font-size:38px}.score{font-size:46px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ib" id="back" data-act="back" aria-label="Back" hidden>&#8249;</button>
    <img src="/icon-192.png" width="40" height="40" alt="" style="border-radius:10px;flex:none"><div><div class="word">ALL</div><div class="badge" id="badge"></div></div>
    <div class="mode" id="mode"></div>
    <button class="ib" data-act="notifs" aria-label="Notifications" id="nbtn" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span id="ncount"></span></button>
    <button class="ib" data-act="go" data-p="search" aria-label="Search" id="sbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </header>
  <div id="view"><div id="main"></div></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);

/* ---------- sport engines ---------- */
// name, engine, lineup size, event set, points [win,draw,loss], solo competitors, best mark
const SPORTS=[['Football','score',11,'fb',[3,1,0]],['Futsal','score',5,'fb',[3,1,0]],['Basketball','periods',5,'',[2,0,1]],['Netball','periods',7,'',[2,1,0]],
['Rugby Union','score',15,'ru',[4,2,0]],['Rugby League','score',13,'rl',[2,1,0]],['Cricket','cricket',11,'',[2,1,0]],['Athletics','race',0,'',0,0,'low'],
['Volleyball','sets',6,'',[3,0,0]],['Beach Volleyball','sets',2,'',[3,0,0]],['Tennis','sets',0,'',[1,0,0],1],['Table Tennis','sets',0,'',[1,0,0],1],['Badminton','sets',0,'',[1,0,0],1],
['Boxing','bout',0,'',0,1],['MMA','bout',0,'',0,1],['Wrestling','bout',0,'',0,1],['Swimming','race',0,'',0,0,'low'],['Cycling','race',0,'',0,0,'low'],['Motorsport','race',0,'',0,0,'low'],
['Handball','score',7,'fb',[2,1,0]],['Hockey','score',11,'fb',[3,1,0]],['Golf','race',0,'',0,0,'low'],['Baseball','score',9,'run',[1,0,0]],['Softball','score',9,'run',[1,0,0]],
['Esports','score',5,'map',[3,0,0]],['Gymnastics','race',0,'',0,0,'high'],['Weightlifting','race',0,'',0,0,'high'],['Taekwondo','bout',0,'',0,1],['Karate','bout',0,'',0,1],['Judo','bout',0,'',0,1],
['Rowing','race',0,'',0,0,'low'],['Canoeing','race',0,'',0,0,'low'],['Archery','race',0,'',0,0,'high'],['Shooting sports','race',0,'',0,0,'high'],['Triathlon','race',0,'',0,0,'low'],['Chess','bout',0,'',0,1],['Other','score',11,'fb',[3,1,0]]];
const SP={};SPORTS.forEach(r=>SP[r[0]]={name:r[0],eng:r[1],n:r[2],ev:r[3],pts:r[4]||[1,0,0],solo:!!r[5],better:r[6]||'low'});SP.Rugby=SP['Rugby Union'];
const ENGCOL={score:'#2bd67b',periods:'#ff8a3d',cricket:'#e6c34a',sets:'#b98bff',bout:'#ff5d73',race:'#35c9ff'};
const EV={fb:[['Goal',1],['Yellow card',0],['Red card',0],['Substitution',0]],ru:[['Try',5],['Conversion',2],['Penalty goal',3],['Drop goal',3],['Yellow card',0],['Red card',0]],rl:[['Try',4],['Conversion',2],['Penalty goal',2],['Drop goal',1],['Sin bin',0]],run:[['Run',1]],map:[['Map won',1]]};
const METHODS=['Decision','KO','TKO','Submission','Points','Disqualification','Walkover','Checkmate','Resignation'];
const LEVELS=['Community','Amateur','Professional','School','University','Youth','Women','National league','National cup','Regional','Continental','National teams'];
const FORMATS=['Round robin','Double round robin','Knockout','Groups then knockout','League and playoff','Custom'];
const BOX={Basketball:[['pts','Points','PTS'],['reb','Rebounds','REB'],['ast','Assists','AST'],['stl','Steals','STL'],['blk','Blocks','BLK']],Netball:[['pts','Goals','G'],['att','Attempts','ATT'],['int','Intercepts','INT']],Cricket:[['runs','Runs','R'],['balls','Balls faced','B'],['wkts','Wickets','W'],['conc','Runs conceded','RC']],Volleyball:[['pts','Points','PTS'],['ace','Aces','ACE'],['blk','Blocks','BLK']],'Beach Volleyball':[['pts','Points','PTS'],['ace','Aces','ACE'],['blk','Blocks','BLK']]};
const KINDS=['Senior men','Senior women','Under-23','Under-20','Under-17','Para'];
const DEFPLANS=[{id:'free',name:'Free',price:'',maxTeams:8,news:true,staff:false,stats:false},{id:'pro',name:'Pro',price:'',maxTeams:24,news:true,staff:true,stats:true},{id:'ent',name:'Enterprise',price:'',maxTeams:0,news:true,staff:true,stats:true}];
const COUNTRIES='Algeria DZ|Angola AO|Benin BJ|Botswana BW|Burkina Faso BF|Burundi BI|Cabo Verde CV|Cameroon CM|Central African Republic CF|Chad TD|Comoros KM|Congo CG|DR Congo CD|Côte d\'Ivoire CI|Djibouti DJ|Egypt EG|Equatorial Guinea GQ|Eritrea ER|Eswatini SZ|Ethiopia ET|Gabon GA|Gambia GM|Ghana GH|Guinea GN|Guinea-Bissau GW|Kenya KE|Lesotho LS|Liberia LR|Libya LY|Madagascar MG|Malawi MW|Mali ML|Mauritania MR|Mauritius MU|Morocco MA|Mozambique MZ|Namibia NA|Niger NE|Nigeria NG|Rwanda RW|São Tomé and Príncipe ST|Senegal SN|Seychelles SC|Sierra Leone SL|Somalia SO|South Africa ZA|South Sudan SS|Sudan SD|Tanzania TZ|Togo TG|Tunisia TN|Uganda UG|Zambia ZM|Zimbabwe ZW'
  .split('|').map(s=>{const i=s.lastIndexOf(' ');return [s.slice(0,i),s.slice(i+1)];});
const flag=n=>{const c=COUNTRIES.find(x=>x[0]===n);return c?String.fromCodePoint(...[...c[1]].map(ch=>127397+ch.charCodeAt(0))):'';};
const sp=l=>SP[l&&l.sport]||SP.Other;
const scol=l=>ENGCOL[sp(l).eng];
const term=l=>{const e=sp(l).eng;return {m:e==='race'?'Events':e==='bout'?'Bouts':'Matches',t:sp(l).solo?'Athletes':'Teams',st:e==='race'?'Medals':e==='bout'?'Records':'Standings'};};

/* ---------- state and store ---------- */

let API=false,since=0,refull=false,polling=false;
async function api(path,method,data){
  const r=await fetch('/api/'+path,{method:method||'GET',credentials:'same-origin',headers:data?{'content-type':'application/json'}:{},body:data?JSON.stringify(data):undefined});
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error((j&&j.error)||'');e.status=r.status;e.data=j;throw e;}
  return j;
}
function apply(docs){for(const [c,id,d] of docs){if(!S[c])continue;S[c]=S[c].filter(x=>x.id!==id);if(d)S[c].push({id,...d});}}
async function sync(full){const r=await api('sync?since='+(full?0:since));if(r.full)COLS.forEach(k=>S[k]=[]);apply(r.docs);since=r.seq;return r.docs;}
async function poll(){if(!API||polling||document.hidden)return;polling=true;
  try{const d=await sync(refull);refull=d.some(x=>x[0]==='leagues');if(d.length)render();}catch(e){}polling=false;}
async function put(path,data){
  if(API){const r=await api('doc/'+path,'PUT',{data}),[c,id]=path.split('/');apply([[c,id,r.data]]);render();}
  else{L.set(path,data);pullLocal();render();}
}
async function del(path){
  if(API){await api('doc/'+path,'DELETE');const [c,id]=path.split('/');
    if(c==='leagues')COLS.forEach(k=>{if(k!=='config')S[k]=S[k].filter(d=>d.id!==id&&d.lid!==id);});else apply([[c,id,null]]);render();}
  else{L.delete(path);pullLocal();render();}
}

/* ---------- helpers ---------- */
const imgOk=s=>typeof s==='string'&&/^data:image\/(png|webp|jpeg);base64,[A-Za-z0-9+/=]+$/.test(s);
const col=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'#2f7bff';
function txtOn(c){const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(r*299+g*587+b*114)/1000>150?'#141414':'#ffffff';}
function crest(t,sz=40){
  if(t&&imgOk(t.logo))return `<img class="crest" width="${sz}" height="${sz}" src="${t.logo}" alt="">`;
  const c=col(t&&t.color),ini=esc(((t&&(t.short||t.name))||'?').slice(0,3).toUpperCase());
  return `<svg class="crest" width="${sz}" height="${sz}" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 43 9v15c0 11-8 18-19 21C13 42 5 35 5 24V9z" fill="${c}" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/><text x="24" y="29" text-anchor="middle" font-family="Archivo,Arial,sans-serif" font-weight="700" font-size="13" fill="${txtOn(c)}">${ini}</text></svg>`;
}
const dOf=m=>{const d=new Date(m.date||'');return isNaN(d)?null:d;};
function when(m){const d=dOf(m);if(!d)return 'Date to be confirmed';
  return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}
const shortDate=s=>{const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});};
const localISO=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
function countdown(m){const d=dOf(m);if(!d)return '';const ms=d-Date.now();if(ms<=0)return 'Starting';
  const dd=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mi=Math.floor(ms%36e5/6e4);return 'Starts in '+(dd?dd+'d '+h+'h':h?h+'h '+mi+'m':mi+'m');}
const isLive=m=>m.status==='live'||m.status==='suspended';
const byDate=(a,b)=>String(a.date||'9').localeCompare(String(b.date||'9'));
const pm=s=>{s=String(s??'').trim();if(!s)return null;const p=s.split(':').map(Number);if(p.some(isNaN))return null;return p.reduce((a,x)=>a*60+x,0);};
function raceRank(m){return (m.entries||[]).map(e=>({...e,v:pm(e.mark)})).filter(e=>e.v!=null).sort((a,b)=>m.better==='high'?b.v-a.v:a.v-b.v).map((e,i)=>({...e,pos:i+1}));}
function outcome(m,l){if(m.status!=='final')return null;const e=sp(l).eng;if(e==='race')return null;
  if(e==='bout'){const w=(m.bout||{}).winner;return w==='home'?'h':w==='away'?'a':w==='draw'?'d':null;}
  if(m.hs==null||m.as==null)return null;return +m.hs>+m.as?'h':+m.hs<+m.as?'a':'d';}
const winner=(m,l)=>{const o=outcome(m,l);return o==='h'?m.home:o==='a'?m.away:o==='d'&&m.tb?m[m.tb]:null;};
const koName=n=>n===1?'Final':n===2?'Semi-finals':n===4?'Quarter-finals':'Round of '+n*2;
const plans=()=>(S.config.find(c=>c.id==='plans')||{}).items||DEFPLANS;
const planOf=l=>plans().find(p=>p.id===(l&&l.plan))||{id:'',name:'Unrestricted',maxTeams:0,news:true,staff:true,stats:true};
const isoT=x=>{const d=new Date(x||'');return isNaN(d)?'':d.toISOString();};
function sc(m,l){const e=sp(l).eng;if(m.status==='scheduled')return 'VS';
  if(e==='bout'){const b=m.bout||{};return m.status!=='final'?'LIVE':b.winner==='draw'?'DRAW':esc((b.method||'WIN')+(b.round?' R'+b.round:''));}
  if(e==='cricket'){const c=m.cr||{},f=x=>x?`${+x.r||0}/${+x.w||0}`:'0/0';return f(c.h)+' · '+f(c.a);}
  return `${+m.hs||0} – ${+m.as||0}`;}
function liveMin(m){if(m.status!=='live'||!m.liveAt)return '';const n=Math.floor((Date.now()-new Date(m.liveAt))/6e4)+1;return n>0&&n<200?n+"'":'';}
function stChip(m,l){if(m.status==='live')return `<span class="chip live">Live${sp(l).eng==='score'&&liveMin(m)?' '+liveMin(m):''}</span>`;
  if(m.status==='suspended')return '<span class="chip live">Suspended</span>';return '';}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3600);}
function standings(l){
  const e=sp(l).eng,ts=teamsOf(l.id),ms=matchesOf(l.id),R={};
  if(e==='race'){ts.forEach(t=>R[t.id]={t,g:0,s:0,b:0});
    ms.filter(m=>m.status==='final').forEach(m=>raceRank(m).slice(0,3).forEach(x=>{const r=R[x.tid];if(r)r['gsb'[x.pos-1]]++;}));
    return {type:'medals',rows:Object.values(R).sort((x,y)=>y.g-x.g||y.s-x.s||y.b-x.b||String(x.t.name).localeCompare(String(y.t.name)))};}
  const pt=l.pts||{w:sp(l).pts[0],d:sp(l).pts[1],l:sp(l).pts[2]};
  ts.forEach(t=>R[t.id]={t,p:0,w:0,d:0,l:0,f:0,a:0,pts:0});
  const grp=ts.some(t=>t.group);
  ms.forEach(m=>{if(m.ko&&grp)return;const o=outcome(m,l),h=R[m.home],a=R[m.away];if(!o||!h||!a)return;h.p++;a.p++;
    if(e!=='bout'){h.f+=+m.hs;h.a+=+m.as;a.f+=+m.as;a.a+=+m.hs;}
    if(o==='h'){h.w++;a.l++;h.pts+=pt.w;a.pts+=pt.l}else if(o==='a'){a.w++;h.l++;a.pts+=pt.w;h.pts+=pt.l}else{h.d++;a.d++;h.pts+=pt.d;a.pts+=pt.d}});
  return {type:e==='bout'?'record':'table',rows:Object.values(R).sort((x,y)=>y.pts-x.pts||y.w-x.w||(y.f-y.a)-(x.f-x.a)||y.f-x.f||String(x.t.name).localeCompare(String(y.t.name)))};
}
function formOf(t){const l=Lg(t.lid);return matchesOf(t.lid).filter(m=>(m.home===t.id||m.away===t.id)&&outcome(m,l)).sort(byDate).slice(-5)
  .map(m=>{const o=outcome(m,l);return o==='d'?'D':(o==='h')===(m.home===t.id)?'W':'L';});}
function age(dob){if(!dob)return'';const d=new Date(dob);if(isNaN(d))return'';const n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0&&a<120?a:'';}
function toImg(file,w,h,cover,alpha){
  return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('read'));
    r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));
      im.onload=()=>{const c=document.createElement('canvas');
        if(cover){c.width=w;c.height=h;const k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;c.getContext('2d').drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);}
        else{c.width=w;c.height=h;const k=Math.min(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;c.getContext('2d').drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);}
        let u;if(alpha){u=c.toDataURL('image/webp',.85);if(!u.startsWith('data:image/webp'))u=c.toDataURL('image/png');}else u=c.toDataURL('image/jpeg',.72);res(u);};
      im.src=r.result;};
    r.readAsDataURL(file);});
}

/* ---------- slider ---------- */
const STYPE={alert:['Alert','live'],announcement:['Announcement','blue'],news:['News','gold'],advert:['Sponsored','']};
const nowISO=()=>new Date().toISOString();
const slideOn=x=>(!x.from||x.from<=nowISO())&&(!x.until||x.until>=nowISO());
function slideItems(lid){
  const act=S.slides.filter(x=>(lid?x.lid===lid:x.home)&&slideOn(x)&&(!x.lid||Lg(x.lid)))
    .sort((a,b)=>(b.type==='alert')-(a.type==='alert')||(+b.prio||0)-(+a.prio||0)||String(b.at).localeCompare(String(a.at)));
  const out=act.map(x=>({k:'slide',x}));
  const wk=new Date(Date.now()-14*864e5).toISOString();
  pubNews().filter(n=>(lid?n.lid===lid:true)&&isoT(n.at)>wk).slice(0,lid?2:3).forEach(n=>out.push({k:'news',x:n}));
  if(!lid)S.heads.slice(0,8).forEach(h=>out.push({k:'ext',x:h}));
  return out;
}
const extA=(href,txt,id,ad)=>`<a class="btn sm" href="${esc(href)}" target="_blank" rel="noopener noreferrer${ad?' sponsored':''}"${id?` data-click="${esc(id)}"`:''}>${esc(txt)} ↗</a>`;
function slideHtml(it){

}

let touchAt=0;
function updDots(t){const i=Math.round(t.scrollLeft/(t.clientWidth||1));t.parentElement.querySelectorAll('.dots button').forEach((b,k)=>b.setAttribute('aria-current',String(k===i)));}
setInterval(()=>{if(sheet||document.hidden||Date.now()-touchAt<12000||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.track').forEach(t=>{const n=t.children.length,w=t.clientWidth;if(n<2||!w)return;const i=Math.round(t.scrollLeft/w);t.scrollTo({left:((i+1)%n)*w,behavior:'smooth'});});},6500);

function roundRobin(ids){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,R=[];
  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const h=a[i],w=a[n-1-i];if(h&&w)pr.push(r%2?[w,h]:[h,w]);}R.push(pr);a.splice(1,0,a.pop());}return R;}
function seedOrder(size){let o=[0];while(o.length<size){const n=o.length*2;o=o.flatMap(x=>[x,n-1-x]);}return o;}
async function makeKO(l,ids,start,gap){
  let size=2;while(size<ids.length)size*=2;const of=Math.log2(size),b=uid(),ord=seedOrder(size),M=[];
  for(let r=0;r<of;r++){const cnt=size>>(r+1);for(let s=0;s<cnt;s++)M.push({id:uid(),lid:l.id,home:'',away:'',date:localISO(new Date(start.getTime()+r*gap*864e5)),venue:'',round:koName(cnt),status:'scheduled',hs:null,as:null,lineups:{},events:[],ko:{b,r,s,of}});}
  const at=(r,s)=>M.find(m=>m.ko.r===r&&m.ko.s===s);
  for(let s=0;s<size/2;s++){const h=ids[ord[2*s]],a=ids[ord[2*s+1]],m=at(0,s);
    if(h&&a){m.home=h;m.away=a;m.venue=(Tm(h)||{}).ground||'';}
    else{m.skip=true;if(of>1)at(1,s>>1)[s%2?'away':'home']=h||a||'';}}
  let n=0;for(const m of M){if(m.skip)continue;const {id,skip,...d}=m;await put('matches/'+id,d);n++;}return n;}

      [{id:'start',label:'First round',type:'datetime-local',value:localISO(d),required:true},{id:'gap',label:'Days between rounds',type:'number',value:7}],

  out.push(['matches/'+uid(),{lid:bb,home:B[2].id,away:B[3].id,...q([21,19,14],[17,23,12]),status:'live',liveAt:new Date(Date.now()-35*6e4).toISOString(),date:day(0,new Date().getHours()),venue:B[2].ground,round:'Round 1',lineups:{[B[2].id]:lu(B[2],5),[B[3].id]:lu(B[3],5)}}]);
  out.push(['matches/'+uid(),{lid:bb,home:B[0].id,away:B[2].id,hs:null,as:null,status:'scheduled',date:day(4,18),venue:B[0].ground,round:'Round 2',lineups:{}}]);
  // athletics
  const at=base('Nairobi Schools Athletics Meet','Athletics','Kenya','Nairobi','School',{format:'Custom',about:'Inter-school track and field meet.',body:'Nairobi Schools Sports Association'});
  const A=mk(at,[['Eastlands High','EAS','#35c9ff'],['Karen Academy','KAR','#f5b833'],['Westlands School','WES','#e63946']],['100m','100m','800m','800m','Long jump','Long jump'],'Kenya');
  const en=(i,j,lane,mark)=>({id:uid(),tid:A[i].id,pid:A[i].players[j].id,name:A[i].players[j].name,lane:String(lane),mark});
  out.push(['matches/'+uid(),{lid:at,name:"Boys' 100m final",better:'low',unit:'s',status:'final',date:day(-1,10),venue:'Nyayo Stadium',round:'Final',entries:[en(0,0,3,'10.84'),en(1,0,4,'10.91'),en(2,0,5,'11.02'),en(0,1,6,'11.10'),en(1,1,2,'11.24')]}]);
  out.push(['matches/'+uid(),{lid:at,name:"Girls' long jump",better:'high',unit:'m',status:'final',date:day(-1,11),venue:'Nyayo Stadium',round:'Final',entries:[en(1,4,1,'5.62'),en(2,4,2,'5.71'),en(0,4,3,'5.40'),en(2,5,4,'5.33')]}]);
  out.push(['matches/'+uid(),{lid:at,name:"Boys' 800m final",better:'low',unit:'',status:'scheduled',date:day(1,10),venue:'Nyayo Stadium',round:'Final',entries:[en(0,2,1,''),en(1,2,2,''),en(2,2,3,''),en(0,3,4,''),en(2,3,5,'')]}]);
  return out;
}

const savePrefs=safe(async()=>{if(API&&S.me)await api('prefs','PUT',S.prefs);else if(API){try{localStorage.setItem('bw_prefs',JSON.stringify(S.prefs));}catch(e){}}});

  portal(){root('m-dash');loadClicks();loadHeads();},
  signin(){openForm({title:'Sign in',submit:'Sign in',keep:true,

    onSubmit:async v=>{const r=await api('login','POST',v);setUser(r.user,r.prefs);await sync(true);render();toast('Signed in.');}});},
  signup(){openForm({title:'Create account',submit:'Create account',keep:true,

    onSubmit:async v=>{const r=await api('register','POST',v);setUser(r.user,null);savePrefs();await sync(true);render();toast('Account created. Welcome to ALL.');}});},
  signout:safe(async()=>{await api('logout','POST',{});setUser(null);S.fan=false;S.stack=[];S.view={page:'profile'};await sync(true);render();}),
  chpass(){openForm({title:'Change password',submit:'Change password',keep:true,
    fields:[{id:'old',label:'Current password',type:'password',required:true},{id:'new',label:'New password (8 characters or more)',type:'password',required:true}],
    onSubmit:async v=>{await api('password','POST',v);toast('Password changed.');}});},
  'tfa-on':safe(async()=>{const r=await api('2fa/setup','POST',{});
    openForm({title:'Two-step sign-in',submit:'Turn on',keep:true,fields:[{id:'code',label:'6-digit code from the app',required:true,max:8}],
      hint:'In Google Authenticator, Microsoft Authenticator or Authy, add an account by typing this key: '+r.secret.match(/.{1,4}/g).join(' ')+'. Then enter the code the app shows.',
      onSubmit:async v=>{await api('2fa/enable','POST',v);S.acct={...S.acct,twofa:true};render();toast('Two-step sign-in is on.');}});}),
  'tfa-off'(){openForm({title:'Turn off two-step sign-in',submit:'Turn off',keep:true,fields:[{id:'password',label:'Your password',type:'password',required:true}],
    onSubmit:async v=>{await api('2fa/disable','POST',v);S.acct={...S.acct,twofa:false};render();toast('Two-step sign-in is off.');}});},
  users:safe(async()=>{S.users=(await api('users')).users;go({page:'m-users'});}),
  'user-do':safe(async(id,el)=>{const r=await api('users/'+id,'POST',{action:el.dataset.x});S.users=(await api('users')).users;render();
    if(r.password)openForm({title:'Temporary password',submit:'Done',fields:[],hint:'Give this person the temporary password '+r.password+' and ask them to change it after signing in.',onSubmit:async()=>{}});}),
  fanview(){S.fan=!S.fan;render();toast(S.fan?'Fan preview on. Management controls are hidden.':'Fan preview off.');},

  box(id,el){boxForm(curM(),el.dataset.x,id);},rumour(){rumourForm(curL());},archive(){archiveForm(curL());},
  'edit-plan'(id){planForm(id);},'comp-plan'(){compPlanForm(curL());},rk(id){upd({rk:id});},
  'del-x':safe(async id=>{await del('transfers/'+id);}),
  mute(id){const a=S.prefs.mute||[];S.prefs={...S.prefs,mute:a.includes(id)?a.filter(x=>x!==id):[...a,id]};render();savePrefs();},
  notifs(){const since=S.prefs.seen||'';S.prefs={...S.prefs,seen:new Date().toISOString()};go({page:'notifs',since});savePrefs();},'edit-team'(){teamForm(curT());},
  'new-match'(){matchForm();},'edit-match'(){matchForm(curM());},gen(){genForm();},

  'add-players'(){playersForm(curT());},'add-staff'(){staffForm(curT());},
  'new-news'(){newsForm();},
  'new-slide'(){slideForm();},'edit-slide'(id){slideForm(S.slides.find(x=>x.id===id));},sources(){sourcesForm();},
  'del-slide':safe(async()=>{const id=sheet.sid,x=S.slides.find(s=>s.id===id);closeSheet();await del('slides/'+id);if(x&&x.lid)await log(x.lid,'Deleted slide: '+x.title);}),
  slide(id,el){const t=el.closest('.slider').querySelector('.track');touchAt=Date.now();t.scrollTo({left:+id*t.clientWidth,behavior:'smooth'});},'edit-news'(id){newsForm(S.news.find(n=>n.id===id));},
  req(id){reqForm(Lg(id));},
  player(id,el){sheet={kind:'player',pid:id,tid:el.dataset.team,title:''};renderSheet();},
  'edit-player'(){const t=Tm(sheet.tid),p=t.players.find(x=>x.id===sheet.pid);playerForm(t,p);},
  transfer(){const t=Tm(sheet.tid),p=t.players.find(x=>x.id===sheet.pid);transferForm(t,p);},
  lineup(){const m=curM(),t=Tm(S.view.side==='away'?m.away:m.home);if(!t)return;const u=(m.lineups||{})[t.id]||{},ok=id=>(t.players||[]).some(p=>p.id===id);
    sheet={kind:'lineup',tid:t.id,title:'Lineup · '+t.name,start:(u.start||[]).filter(ok),bench:(u.bench||[]).filter(ok)};renderSheet();},
  lu(id,el){const s=sheet,to=el.dataset.x,l=Lg(Tm(s.tid).lid),max=+l.starters||sp(l).n||11;
    if(to==='start'&&!s.start.includes(id)&&s.start.length>=max){toast('All '+max+' starting places are taken. Move someone to the bench first.');return;}
    s.start=s.start.filter(x=>x!==id);s.bench=s.bench.filter(x=>x!==id);
    if(to==='start')s.start.push(id);else if(to==='bench')s.bench.push(id);renderSheet();},

  st:safe(async id=>{const m=curM(),l=Lg(m.lid),p={status:id},ttl=m.name||nm(Tm(m.home))+' v '+nm(Tm(m.away));
    if(id==='live'&&!m.liveAt)p.liveAt=new Date().toISOString();
    if(id==='live'&&m.hs==null){p.hs=0;p.as=0;}
    if(id==='final'){p.doneAt=new Date().toISOString();
      if(m.ko&&outcome({...m,...p},l)==='d'&&!m.tb){openForm({title:'Who goes through?',submit:'Confirm final result',
        fields:[{id:'tb',label:'Winner after extra time, penalties or a tie-break',type:'select',options:[['home',nm(Tm(m.home))],['away',nm(Tm(m.away))]]}],
        onSubmit:async v=>{const n={...m,...p,tb:v.tb};await put('matches/'+m.id,body(n));await advance(n,l);await log(m.lid,'Confirmed final result on a tie-break for '+ttl);}});return;}}
    const n={...m,...p};await put('matches/'+m.id,body(n));if(id==='final')await advance(n,l);
    await log(m.lid,({live:'Started or resumed',suspended:'Suspended',final:'Confirmed final result for'}[id])+' '+ttl);}),
  bump:safe(async(id,el)=>{const m=curM(),k=id==='home'?'hs':'as',n=Math.max(0,(+m[k]||0)+(+el.dataset.x));
    await put('matches/'+m.id,{...body(m),[k]:n,[k==='hs'?'as':'hs']:+m[k==='hs'?'as':'hs']||0});await log(m.lid,`Score changed: ${nm(Tm(m[id]))} now ${n}`);}),
  'del-ev':safe(async id=>{const m=curM(),e=(m.events||[]).find(x=>x.id===id);if(!e)return;const k=e.side==='home'?'hs':'as';
    await put('matches/'+m.id,{...body(m),events:m.events.filter(x=>x.id!==id),[k]:Math.max(0,(+m[k]||0)-(+e.pts||0))});await log(m.lid,'Removed event: '+e.type+' '+(e.name||''));}),
  'del-entry':safe(async()=>{const m=curM(),id=sheet.eid;closeSheet();await put('matches/'+m.id,{...body(m),entries:(m.entries||[]).filter(x=>x.id!==id)});}),
  'del-staff':safe(async id=>{const t=curT();await put('teams/'+t.id,{...body(t),staff:t.staff.filter(x=>x.id!==id)});}),
  arm(id,el){if(el.dataset.armed){A[id]();return;}el.dataset.armed='1';el.textContent='Tap again to confirm';},
  release:safe(async()=>{const t=Tm(sheet.tid),p=t.players.find(x=>x.id===sheet.pid);closeSheet();
    await put('teams/'+t.id,{...body(t),players:t.players.filter(x=>x.id!==p.id)});
    await put('transfers/'+uid(),{lid:t.lid,pid:p.id,player:p.name,type:'released',from:t.name,to:'',at:new Date().toISOString()});await log(t.lid,`Released ${p.name} from ${t.name}`);}),
  'del-team':safe(async()=>{const t=curT();closeSheet();A.back();await del('teams/'+t.id);await log(t.lid,'Deleted '+t.name);}),
  'del-match':safe(async()=>{const m=curM();closeSheet();A.back();await del('matches/'+m.id);await log(m.lid,'Deleted fixture '+(m.name||nm(Tm(m.home))+' v '+nm(Tm(m.away))));}),
  'del-news':safe(async()=>{const id=sheet.nid;closeSheet();await del('news/'+id);}),
  'del-comp':safe(async()=>{const l=curL();closeSheet();root(S.view.page.startsWith('m-')?'m-comps':'home');await wipe(l.id);toast('Competition deleted.');}),

    if(API){await api('approve','POST',{id});await sync(true);render();toast('Approved.');return;}
    if(r.role==='manager'){const t=Tm(r.tid);if(t)await put('teams/'+t.id,{...body(t),managers:[...new Set([...(t.managers||[]),r.uid])]});}
    else await put('leagues/'+l.id,{...body(l),roles:{...(l.roles||{}),[r.uid]:r.role}});
    await del('requests/'+id);await log(l.id,'Approved a '+r.role+' request');toast('Approved.');}),
  decline:safe(async id=>{await del('requests/'+id);}),
  'role-rm':safe(async id=>{const l=curL(),r={...(l.roles||{})};delete r[id];await put('leagues/'+l.id,{...body(l),roles:r});await log(l.id,'Removed a staff role');}),
  'mgr-rm':safe(async(id,el)=>{const t=Tm(el.dataset.team);await put('teams/'+t.id,{...body(t),managers:(t.managers||[]).filter(u=>u!==id)});await log(t.lid,'Removed a manager from '+t.name);}),

async function wipe(lid){
  if(API){await del('leagues/'+lid);return;}
  const paths=[...S.teams.filter(x=>x.lid===lid).map(x=>'teams/'+x.id),...S.matches.filter(x=>x.lid===lid).map(x=>'matches/'+x.id),...S.transfers.filter(x=>x.lid===lid).map(x=>'transfers/'+x.id),...S.news.filter(x=>x.lid===lid).map(x=>'news/'+x.id),...S.requests.filter(x=>x.lid===lid).map(x=>'requests/'+x.id),...S.slides.filter(x=>x.lid===lid).map(x=>'slides/'+x.id),'audit/'+lid,'leagues/'+lid];
  for(const p of paths)await del(p);
}
document.addEventListener('click',e=>{
  const ck=e.target.closest('a[data-click]');if(ck&&API)fetch('/api/click',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({id:ck.dataset.click})}).catch(()=>{});
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='sheet')closeSheet();return;}
  const fn=A[el.dataset.act];if(fn)fn(el.dataset.id,el);
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='form')submitForm();});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.view.q=e.target.value;$('#results').innerHTML=results(e.target.value);}});
document.addEventListener('change',e=>{
  if(e.target.id==='f-sport'&&SP[e.target.value]&&document.getElementById('f-starters')){const s=SP[e.target.value];
    for(const [k,x] of [['starters',s.n||''],['pw',s.pts[0]],['pd',s.pts[1]],['pl',s.pts[2]]]){const el=document.getElementById('f-'+k);if(el)el.value=x;}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet();});
setInterval(()=>{if(!sheet&&['home','live','match','m-match','m-control'].includes(S.view.page)&&S.matches.some(isLive))render();},30000);

/* ---------- boot ---------- */
function setUser(u,prefs){S.acct=u||null;S.me=u?u.id:null;S.isOwner=!!u&&u.role==='owner';S.canWrite=!!u;if(u)S.names[u.id]=u.name;
  if(prefs)S.prefs={...S.prefs,...prefs};}
function goLocal(){S.mode='local';S.me='demo';S.isOwner=true;S.names.demo='You';for(const [p,d] of exampleDocs())L.set(p,d);pullLocal();render();}
async function start(){
  S.canWrite=false;render();
  if(location.protocol==='file:'){S.canWrite=true;goLocal();return;}
  const timer=setTimeout(()=>{S.slow=true;render();},8000);
  for(;;){
    try{const me=await api('me');API=true;
      if(me.user)setUser(me.user,me.prefs);else{try{const p=JSON.parse(localStorage.getItem('bw_prefs')||'null');if(p)S.prefs={...S.prefs,...p};}catch(e){}}
      await sync(true);break;
    }catch(e){S.slow=true;render();await new Promise(r=>setTimeout(r,4000));}
  }
  clearTimeout(timer);S.slow=false;S.mode='db';render();
  setInterval(poll,10000);document.addEventListener('visibilitychange',poll);
  loadHeads();setInterval(loadHeads,15*6e4);
}
start();
