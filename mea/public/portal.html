<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEA Portal</title>
<meta name="description" content="Sign in to the MEA portal: students, teachers and MEA departments.">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="/portal-theme.css">
<style>
.course{display:grid;gap:10px}
.course .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.enrol{display:grid;gap:10px}
.enrol .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.results{font-size:14px;display:grid;gap:4px}
.results div{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:4px}
.cert{border:6px double var(--charcoal);padding:34px 28px;text-align:center;display:grid;gap:10px;background:#fff;color:#1b1f26}
.cert img{height:70px;margin:0 auto}
.cert h2{font-size:28px;letter-spacing:.02em}
.cert .name{font:700 26px var(--f-head);border-bottom:1px solid #999;padding-bottom:6px;margin:6px 30px}
.cert small{color:#555}
.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inline input[type=range]{width:120px;padding:0}
.inline input[type=number]{width:74px}
.lesson{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
.lesson summary{display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none}
.lesson summary::-webkit-details-marker{display:none}
.lesson .lk{width:22px;text-align:center}
.vid{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.prose p{margin:0 0 10px}
fieldset.q{border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:6px}
fieldset.q legend{padding:0 6px;font-weight:600}
.thread{max-height:46vh;overflow:auto;display:grid;gap:8px;padding:6px 2px;margin:8px 0}
.msg{background:var(--sky);border-radius:14px 14px 14px 4px;padding:8px 12px;max-width:85%}
.msg.mine{background:var(--info-bg);justify-self:end;border-radius:14px 14px 4px 14px}
.msg small{color:var(--muted);font-size:11px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.qr{display:flex;justify-content:center;margin:6px 0}.qr svg{width:96px;height:96px}
.split{align-items:start}
@media print{body.pc main,body.pc .top,body.pc footer{display:none!important} body.pc dialog{box-shadow:none;max-width:none;width:100%} body.pc .dlg .actions{display:none}}
</style>
<style>.nx-credit{opacity:.75;font-size:13px;margin-top:14px}.nx-credit a{color:inherit;text-decoration:underline}</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><img src="/logo.png" alt="MEA"><div><b>MEA Portal</b><span>Students · Teachers · Departments</span></div></a>
  <nav class="topnav" id="topnav" aria-label="Main"></nav>
</div></header>
<main class="wrap" id="root"><p class="muted">Loading…</p></main>
<footer class="foot"><div class="wrap">MEA · Mechanical, Electrical &amp; Automation · Australia | Zimbabwe<br><span class="nx-credit">Website by <a href="https://wa.me/61402600743?text=Hi%20Nexora%20Digital%2C%20I%20saw%20the%20MEA%20website%20and%20I%27d%20like%20a%20website%20for%20my%20business." target="_blank" rel="noopener">Nexora Digital</a></span></div></footer>
<script src="/vendor/qrcode.js"></script>
<script src="/app.js"></script>
<script src="/portal.js"></script>
</body>
</html>
