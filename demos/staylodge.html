<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StayLodge · Hotel, lodge &amp; guest house | Live demo by Nexora Digital</title>
<meta name="description" content="Rooms, reservations, check-in and check-out, guest bills and housekeeping for lodges and hotels. Try the live demo of StayLodge, built by Nexora Digital in Zimbabwe.">
<meta name="theme-color" content="#115e59">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2040%2040%22%20aria-hidden%3D%22true%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g-staylodge%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23115e59%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23eab308%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2211%22%20fill%3D%22url(%23g-staylodge)%22%2F%3E%3Cpath%20d%3D%22M0%2028%20Q20%2018%2040%2026%20V40%20H0Z%22%20fill%3D%22%23fff%22%20opacity%3D%22.1%22%2F%3E%3Cg%20transform%3D%22translate(8%208)%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M2%2020V5M2%2017h20v3M22%2017v-5a3%203%200%200%200-3-3H10v8M6%2012a2%202%200%201%200%200-4%202%202%200%200%200%200%204%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>:root{
  --brand:#1e3a8a;--brand2:#f59e0b;
  --bg:#f4f5f8;--surface:#fff;--ink:#13161b;--muted:#5b6370;--line:#e3e6ec;--line2:#eef0f4;
  --b-ink:color-mix(in srgb,var(--brand) 86%,#000);--b-soft:color-mix(in srgb,var(--brand) 8%,#fff);--b-mid:color-mix(in srgb,var(--brand) 22%,#fff);
  --side:color-mix(in srgb,var(--brand) 80%,#05070b);--bar:var(--brand);
  --ok:#137a46;--ok-bg:#e2f4ea;--warn:#935600;--warn-bg:#fff0d4;--bad:#b42318;--bad-bg:#fde6e3;--info:#1f5aa6;--info-bg:#e6eefa;--grey-bg:#eceef2;
  --r:14px;--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1014;--surface:#161a20;--ink:#eceef2;--muted:#a0a8b4;--line:#2a3039;--line2:#20252d;
  --b-ink:color-mix(in srgb,var(--brand) 38%,#fff);--b-soft:color-mix(in srgb,var(--brand) 18%,#161a20);--b-mid:color-mix(in srgb,var(--brand) 35%,#161a20);
  --side:color-mix(in srgb,var(--brand) 45%,#07090c);--bar:color-mix(in srgb,var(--brand) 55%,#fff);
  --ok:#5fd08e;--ok-bg:#11301f;--warn:#f2bd5a;--warn-bg:#33260d;--bad:#ff8b80;--bad-bg:#3b1613;--info:#8fb8f5;--info-bg:#142740;--grey-bg:#252a32;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014;--surface:#161a20;--ink:#eceef2;--muted:#a0a8b4;--line:#2a3039;--line2:#20252d;
  --b-ink:color-mix(in srgb,var(--brand) 38%,#fff);--b-soft:color-mix(in srgb,var(--brand) 18%,#161a20);--b-mid:color-mix(in srgb,var(--brand) 35%,#161a20);
  --side:color-mix(in srgb,var(--brand) 45%,#07090c);--bar:color-mix(in srgb,var(--brand) 55%,#fff);
  --ok:#5fd08e;--ok-bg:#11301f;--warn:#f2bd5a;--warn-bg:#33260d;--bad:#ff8b80;--bad-bg:#3b1613;--info:#8fb8f5;--info-bg:#142740;--grey-bg:#252a32;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:var(--b-ink)}
button{font:inherit;color:inherit}
.i{flex:none}
.muted{color:var(--muted)}.small{font-size:12.5px}.dim{color:var(--muted);opacity:.6}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,#fff);outline-offset:2px;border-radius:8px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14px;padding:9px 15px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;text-decoration:none;white-space:nowrap;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--b-soft);filter:none}
.btn.danger{color:var(--bad)}.btn.danger.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.big{width:100%;padding:13px;font-size:15px;margin-top:4px}
.link{background:none;border:0;color:var(--b-ink);font-weight:700;cursor:pointer;padding:4px;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;position:relative;color:var(--ink)}
.iconbtn:hover{background:var(--b-soft)}
.iconbtn i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--f);font-style:normal;padding:0 4px;text-align:center}

/* pills */
.pill{display:inline-flex;align-items:center;font-weight:700;font-size:11.5px;line-height:1;padding:5px 9px;border-radius:999px;white-space:nowrap;background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.grey{background:var(--grey-bg);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--info);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--b-soft);color:var(--b-ink)}
.stars{color:#e0a100;letter-spacing:1px}.stars i{color:var(--line);font-style:normal}
.mbar{display:inline-block;width:70px;height:7px;border-radius:9px;background:var(--line);overflow:hidden;vertical-align:middle;margin-right:6px}.mbar i{display:block;height:100%;background:var(--bar)}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.login-brand{position:relative;overflow:hidden;color:#fff;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:30px;
  background:radial-gradient(1200px 500px at 110% -10%,color-mix(in srgb,var(--brand2) 55%,transparent),transparent 60%),linear-gradient(150deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#05070b))}
.login-brand::after{content:"";position:absolute;inset:auto -80px -120px auto;width:380px;height:380px;border-radius:50%;border:60px solid rgba(255,255,255,.06)}
.lb-in{position:relative;z-index:1;display:grid;gap:22px;max-width:560px;margin-block:auto}
.lb-logo{display:flex;align-items:center;gap:14px}
.lb-logo svg{box-shadow:0 10px 30px -8px rgba(0,0,0,.5);border-radius:14px}
.lb-logo b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.lb-logo span{opacity:.8;font-weight:600}
.lb-in h1{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-.025em}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.ticks .i{margin-top:2px;padding:2px;border-radius:50%;background:rgba(255,255,255,.18);width:20px;height:20px}
.lb-org{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:10px 14px;border-radius:12px;width:fit-content}
.lb-foot{position:relative;z-index:1;font-size:13px;opacity:.8}.lb-foot a{color:#fff;font-weight:700}
.login-pick{display:flex;align-items:center;justify-content:center;padding:40px clamp(16px,4vw,48px)}
.pick-in{width:100%;max-width:500px;display:grid;gap:14px}
.pick-in h2{font-size:28px;font-weight:800}
.demo-tag{display:inline-flex;align-items:center;gap:6px;width:fit-content;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--b-ink);background:var(--b-soft);padding:6px 10px;border-radius:999px}
.roles{display:grid;gap:10px;margin-top:6px}
.role{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--sh);transition:border-color .15s,transform .15s}
.role:hover{border-color:var(--brand);transform:translateY(-1px)}
.role>.i{color:var(--muted);margin-left:auto}
.rt{display:grid;gap:1px;min-width:0}
.rt b{font-size:15px}.rt small{color:var(--b-ink);font-weight:700;font-size:12.5px}.rt em{font-style:normal;color:var(--muted);font-size:13px}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));flex:none}
.pick-cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-brand{padding:28px 16px 26px;gap:18px}
  .lb-in{gap:14px}.lb-in h1{font-size:24px}
  .ticks li:nth-child(n+4){display:none}
  .lb-foot{display:none}
  .login-pick{padding:24px 16px 40px;align-items:flex-start}
}

/* app shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:18px 12px}
.side-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.side-brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.side-brand span{display:block;font-size:12px;opacity:.7;line-height:1.3}
.nav{display:grid;gap:2px;padding:14px 0;overflow-y:auto;align-content:start;flex:1}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;background:none;color:rgba(255,255,255,.78);font-weight:600;cursor:pointer;text-align:left;position:relative;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--brand2)}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:12px;display:grid;gap:2px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px 10px}
.me .av{width:36px;height:36px;font-size:12.5px;border-radius:10px;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.me b{display:block;font-size:13.5px}.me small{opacity:.7;font-size:12px}
.sf{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;color:rgba(255,255,255,.72);font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;text-decoration:none}
.sf:hover{background:rgba(255,255,255,.08);color:#fff}
.sf.credit{font-weight:500;font-size:12px;opacity:.8}.sf.credit b{color:#fff;margin-left:3px}
.main{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 28px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
.bar h1{font-size:22px;font-weight:800}
.crumb{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.demo-pill{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--brand2);color:#111;padding:2px 7px;border-radius:5px}
.bar-r{display:flex;align-items:center;gap:8px}
.mob{display:none}
#view{padding:24px 28px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start;outline:none;max-width:1400px;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:column;padding:10px 0 0;min-width:0}
  .side-brand{padding:0 16px 8px;border:0}
  .side-brand svg{width:30px;height:30px}
  .nav{display:flex;overflow-x:auto;padding:0 10px 8px;gap:4px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{padding:8px 12px;font-size:13.5px;flex:none}
  .nav button[aria-current="page"]::before{left:12px;right:12px;top:auto;bottom:2px;width:auto;height:3px;border-radius:3px}
  .side-foot{display:none}
  .bar{position:static;padding:14px 16px}
  .bar h1{font-size:19px}
  .mob{display:inline-grid}
  .crumb .co{display:none}
  .kpi b{font-size:22px}
  .bar .cta span{display:none}
  .bar .cta{padding:9px 11px}
  #view{padding:16px 16px 60px;gap:14px}
}

/* cards & dashboard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hello h2{font-size:24px;font-weight:800}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--brand),var(--brand2))}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600;display:block}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:12px}
.kpis.sm .kpi{padding:12px 16px}.kpis.sm .kpi b{font-size:20px}
.alerts{display:grid;gap:4px}
.alerts h3{margin-bottom:6px}
.alerts.calm{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:600}
.al{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600}
.al:hover{background:var(--b-soft)}
.al .i{margin-left:auto;color:var(--muted)}
.al.bad{background:color-mix(in srgb,var(--bad-bg) 60%,transparent)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.chart h3{margin-bottom:14px}
.cols{display:flex;align-items:stretch;gap:10px;height:190px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cb{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.cb i{display:block;width:min(42px,80%);border-radius:7px 7px 3px 3px;background:var(--b-mid)}
.col.now .cb i{background:linear-gradient(var(--brand2),var(--brand))}
.cv{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cl{font-size:12px;color:var(--muted);font-weight:600}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;align-items:center;gap:10px;font-size:13px}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bt{height:10px;border-radius:9px;background:var(--line2);overflow:hidden}
.bt i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 60%,#fff))}
.bv{font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.empty-s{padding:10px 0}

/* page head & toolbar */
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{display:flex;align-items:center;gap:6px;padding:8px 12px;border:0;background:none;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--b-soft);color:var(--b-ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;flex:1 1 240px;max-width:380px;color:var(--muted)}
.search input{border:0;background:none;padding:10px 0;font:inherit;color:var(--ink);width:100%;outline:none}
.search:focus-within{border-color:var(--brand)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.chip i{font-style:normal;font-size:11px;background:var(--line2);padding:1px 6px;border-radius:9px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip[aria-pressed="true"] i{background:rgba(255,255,255,.22);color:#fff}
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}

/* tables */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--sh)}
.tw.mini{box-shadow:none;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb,var(--b-soft) 55%,var(--surface));white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
.tw.mini th{cursor:default}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--b-soft)}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:2px solid var(--line);border-bottom:0;background:color-mix(in srgb,var(--b-soft) 40%,var(--surface))}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.ref,.ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);white-space:nowrap}
td.tt{font-weight:700}
.count{text-align:right}
.empty{display:grid;place-items:center;gap:8px;padding:40px;color:var(--muted);text-align:center}
@media (max-width:700px){
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td,.rt tfoot{display:block}
  .tw:has(.rt){background:none;border:0;box-shadow:none;overflow:visible}
  .rt tbody tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 14px;box-shadow:var(--sh)}
  .rt td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border:0;text-align:right}
  .rt td::before{content:attr(data-label);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left}
  .rt td.tt{font-size:15px}
  .rt tfoot tr{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-radius:12px;background:var(--b-soft)}
  .rt tfoot td{background:none;border:0;padding:0}
  .rt tfoot td:empty{display:none}
}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.lane{background:color-mix(in srgb,var(--line2) 70%,var(--bg));border-radius:var(--r);padding:10px;display:grid;gap:8px;min-height:120px}
.lane-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;padding:4px 6px}
.lane-h b{margin-left:auto;font-size:12px;background:var(--surface);border-radius:9px;padding:1px 8px;color:var(--muted)}
.lane-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:12px;opacity:.7}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;cursor:pointer;box-shadow:var(--sh)}
.bcard:hover{border-color:var(--brand)}
.bcard b{font-size:14px}
.bf{font-size:12.5px;color:var(--muted)}
.next{justify-self:start;margin-top:6px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--b-soft);color:var(--b-ink);cursor:pointer}
.next:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog.narrow{width:min(380px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(8,10,14,.55);backdrop-filter:blur(2px)}
.dlg{padding:22px;display:grid;gap:16px;max-height:calc(100dvh - 32px);overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh h2{font-size:20px;font-weight:800;margin-top:2px}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 18px;margin:0;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--b-soft) 60%,var(--surface))}
.dl div{min-width:0}.dl .wide{grid-column:1/-1}
.dl dt{font-size:12px;color:var(--muted);font-weight:600}
.dl dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.rel{display:grid;gap:8px}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.frm{display:grid;gap:16px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
label{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
input,select,textarea{font:14.5px var(--f);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.err{color:var(--bad);font-weight:700;font-size:13.5px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.dlg{padding:18px}}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14171c;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:1000;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px);animation:tin .2s ease-out}
.toast .i{color:#5fd08e}.toast.bad{background:var(--bad)}.toast.bad .i{color:#fff}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.pos>section{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pitem{display:grid;gap:4px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--sh);align-content:start;min-height:120px}
.pitem:hover{border-color:var(--brand)}
.pitem:disabled{opacity:.5;cursor:not-allowed}
.pitem b{font-size:14px;line-height:1.3}
.pcat{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--b-ink)}
.pp{font-size:17px;font-weight:800;margin-top:auto;font-variant-numeric:tabular-nums}
.ps{font-size:12px;color:var(--muted);font-weight:600}.ps.warn{color:var(--warn)}.ps.bad{color:var(--bad)}
.cart{position:sticky;top:90px;display:grid;gap:12px}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.cline b{font-size:13.5px}.cline small{display:block;color:var(--muted);font-size:12px}
.cline .lt{grid-column:2;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:16px}
.cart-empty{display:grid;place-items:center;gap:6px;color:var(--muted);padding:24px 0;opacity:.75}
.ctotal{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;padding-top:4px}
.ctotal b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.mth{display:block;position:relative}
.mth input{position:absolute;opacity:0;pointer-events:none}
.mth span{display:block;text-align:center;padding:9px 6px;border-radius:10px;border:1px solid var(--line);font-weight:700;color:var(--ink);font-size:13px;cursor:pointer}
.mth input:checked+span{border-color:var(--brand);background:var(--b-soft);color:var(--b-ink);box-shadow:inset 0 0 0 1px var(--brand)}
.mth input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--brand) 55%,#fff)}
@media (max-width:980px){.pos{grid-template-columns:minmax(0,1fr)}.cart{position:static}}
.toolbar>*{min-width:0}
.receipt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;display:grid;gap:6px;padding:16px;border:1px dashed var(--line);border-radius:12px}
.rc-h{display:grid;justify-items:center;gap:4px;text-align:center;padding-bottom:8px;border-bottom:1px dashed var(--line);font-family:var(--f)}
.rc-m,.rc-l,.rc-t{display:flex;justify-content:space-between;gap:10px}
.rc-m{color:var(--muted);font-size:12px}
.rc-t{font-weight:800;font-size:16px;border-top:1px dashed var(--line);padding-top:8px}
.rc-f{text-align:center;color:var(--muted);font-size:12px;padding-top:6px}

/* agenda */
.agenda{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:200px;box-shadow:var(--sh)}
.day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--sh)}
.day h3{display:flex;align-items:baseline;gap:6px;font-size:13px;padding:2px 4px 6px;border-bottom:1px solid var(--line2)}
.day h3 span{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.05em}
.day h3 b{font-size:20px;font-weight:800}.day h3 small{color:var(--muted)}
.day h3 i{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;background:var(--b-soft);color:var(--b-ink);padding:1px 7px;border-radius:9px}
.day.today h3 b{color:var(--b-ink)}
.ev{display:grid;gap:2px;padding:9px 10px;border-radius:10px;background:var(--b-soft);border-left:3px solid var(--brand);cursor:pointer}
.ev:hover{filter:brightness(.97)}
.ev .et{font-size:11.5px;font-weight:800;color:var(--b-ink)}
.ev b{font-size:13px;line-height:1.25}.ev small{font-size:12px;color:var(--muted)}
.ev .pill{justify-self:start;margin-top:3px;font-size:10.5px;padding:3px 7px}
@media (max-width:1100px){.agenda{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.day{min-height:0}}

/* reports */
.rsel{display:flex;gap:10px;flex-wrap:wrap}
.rsel label{min-width:180px}
.rmeta{margin-bottom:4px}
#report{display:grid;gap:14px}

/* print */
.print-only{display:none}
.ph{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px solid #222;margin-bottom:14px}
.ph b{display:block;font-size:17px}.ph span{font-size:12px;color:#555}
.ph h2{margin-left:auto;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
.pmeta{display:flex;gap:24px;margin-bottom:12px;font-size:13px}
.ptab th{background:#f2f2f2;color:#333;width:38%;text-transform:none;letter-spacing:0;font-size:13px;position:static}
.ptab th,.ptab td{border:1px solid #ddd}
.pf{margin-top:18px;font-size:11px;color:#666;text-align:center}
@media print{
  body.printing .app>.side,body.printing .bar,body.printing #view,body.printing dialog,body.printing .toast{display:none!important}
  body.printing .app{display:block}
  body.printing #printdoc{display:block!important;color:#000}
  body.printing #printdoc .print-only,body.printing #printdoc [class=""]{display:block}
  body{background:#fff}
  .card,.kpi,.tw{box-shadow:none!important;border-color:#ccc!important;background:#fff!important;color:#000}
  .kpi::after{display:none}
  th{background:#eee!important;color:#000!important}
  .noprint{display:none!important}
}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 14px}.kpi b{font-size:20px}.kpi small{font-size:11.5px}
  .tw.mini td,.tw.mini th{white-space:nowrap;padding:9px 10px}
  .hello h2{font-size:20px}
}
</style>

  const pad = (n) => String(n).padStart(2, '0');

  function freshState(keep) { const { db, seq } = seedDB(); return { v: VER, day: todayS, touched: false, db, seq, role: keep ? keep.role : null, theme: keep ? keep.theme : null }; }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && s.v === VER && s.db) { S = (s.day !== todayS && !s.touched) ? freshState(s) : s; return; }
    } catch (e) { /* storage blocked */ }

  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
  const touch = () => { S.touched = true; save(); };

  /* ---------- values, filters, aggregates ---------- */
  let role = null;
  const H = {
    get db() { return S.db; }, today: todayS, days, addDays, money, moneyS, num,
    me: () => (role ? role.person : ''),
    where: (tn, e) => where(tn, e),
    sum: (tn, fk, e) => agg(`sum:${tn}.${fk}${e ? '?' + e : ''}`),
    count: (tn, e) => agg(`count:${tn}${e ? '?' + e : ''}`),
    find: (tn, k, v) => S.db[tn].find((r) => r[k] == v),
    val: (tn, r, k) => val(T[tn], r, k)
  };
  function val(t, r, f) {
    if (typeof f === 'string') f = F(t, f) || { k: f };
    if (f.calc) { try { return t.calc[f.k](r, H); } catch (e) { return ''; } }
    return r[f.k];
  }
  function resolve(v, t, r) {
    v = String(v).trim();
    if (v === 'today') return todayS;
    if (v === 'me') return H.me();
    const m = v.match(/^d([+-]?\d+)$/); if (m) return addDays(+m[1]);
    if (v[0] === '@') return val(t, r, v.slice(1));
    return v;
  }
  function cond(t, r, c) {
    const m = c.match(/^([\w]+)\s*(<=|>=|!=|=|<|>|~)\s*(.*)$/);
    if (!m) return true;
    const [, k, op] = m;
    const a = k === 'id' ? r.id : val(t, r, k);
    const b = resolve(m[3], t, r);
    const blankA = a == null || a === '';
    if ((op === '=' || op === '!=') && String(b).includes(',')) { const inSet = String(b).split(',').includes(String(a)); return op === '=' ? inSet : !inSet; }
    if (op === '=') return blankA ? b === '' : String(a) === String(b);
    if (op === '!=') return blankA ? b !== '' : String(a) !== String(b);
    if (op === '~') return String(a || '').toLowerCase().includes(String(b).toLowerCase());
    if (blankA || b === '') return false;
    const na = Number(a), nb = Number(b);
    const n = !isNaN(na) && !isNaN(nb);
    const x = n ? na : String(a), y = n ? nb : String(b);
    return op === '<' ? x < y : op === '>' ? x > y : op === '<=' ? x <= y : x >= y;

  const matchExpr = (t, r, e) => !e || (typeof e === 'function' ? e(r, H) : e.split('&').every((c) => cond(t, r, c.trim())));
  const rowsOf = (tn) => { const sc = role && role.scope && role.scope[tn]; return sc ? S.db[tn].filter((r) => matchExpr(T[tn], r, sc)) : S.db[tn]; };
  const where = (tn, e) => rowsOf(tn).filter((r) => matchExpr(T[tn], r, e));
  function agg(spec) {
    if (typeof spec === 'function') return spec(H);
    const [kind, rest] = split1(spec, ':');
    const [path, e] = split1(rest, '?');
    const [tn, fk] = path.split('.');
    const rows = where(tn, e), t = T[tn];
    if (kind === 'count') return rows.length;
    const vals = rows.map((r) => Number(val(t, r, fk)) || 0);
    const s = vals.reduce((a, b) => a + b, 0);
    if (kind === 'sum') return s;
    if (kind === 'avg') return vals.length ? s / vals.length : 0;
    if (kind === 'max') return vals.length ? Math.max(...vals) : 0;
    if (kind === 'min') return vals.length ? Math.min(...vals) : 0;

  }
  function series(spec) {
    const [kind, rest] = split1(spec, ':');

    if (kind === 'month') {
      const out = [];

      rows.forEach((r) => { const ym = String(val(t, r, p[1]) || '').slice(0, 7); const o = out.find((x) => x[0] === ym); if (o) o[2] += p[2] ? Number(val(t, r, p[2])) || 0 : 1; });
      return out.map((x) => [x[1], x[2]]);

  /* ---------- formatting ---------- */
  const OK = /\b(paid|active|done|complete|completed|approved|in stock|delivered|available|closed|resolved|passed|present|won|ready|served|checked out|cleared|current|valid|fit|returned|hired|confirmed|attended|settled|good|operational|signed|in service|received|issued|on track|live|healthy|repaid|fulfilled|vacant|in date|compliant|reconciled|sold|harvested|dispatched|checked in|in use|placed)\b/i;

  const canEdit = (tn) => role.mods.some((m) => m.k === tn && !m.ro) || Object.values(C.modules || {}).some((m) => (m.table === tn || m.sales === tn) && role.mods.some((x) => C.modules[x.k] === m && !x.ro));

  /* ---------- table module ---------- */
  function sorted(t, rows) {
    const s = ui.sort[t.name];

    const dir = s ? s.dir : -1;

    if (q) rows = rows.filter((r) => String(r.id).toLowerCase().includes(q) || t.fields.some((f) => String(val(t, r, f) == null ? '' : val(t, r, f)).toLowerCase().includes(q)));

  }
  function viewTable(v, m) {

        </div></div>
      ${t.stats ? `<div class="kpis sm">${t.stats.map(([l, s, k]) => `<div class="kpi"><span>${esc(l)}</span><b>${fmtV(agg(s), k)}</b></div>`).join('')}</div>` : ''}
      <div class="toolbar">
        <label class="search">${ic('search', 16)}<input type="search" placeholder="Search ${esc(t.label.toLowerCase())}" value="${esc(ui.q[t.name] || '')}" aria-label="Search"></label>
        ${t.statusF && view === 'list' ? `<div class="chips">${['All', ...t.statusF.opts.map((o) => o.v)].map((o) => `<button class="chip" data-st="${esc(o)}" aria-pressed="${o === st}">${esc(o)}<i>${o === 'All' ? rowsOf(t.name).length : rowsOf(t.name).filter((r) => val(t, r, t.statusF) === o).length}</i></button>`).join('')}</div>` : ''}

      ${ui.filter && ui.filter.table === t.name ? `<div class="filterbar">${ic('bell', 14)} Showing: <b>${esc(ui.filter.text)}</b><button class="link" data-clear>Show everything</button></div>` : ''}
      <div id="rows"></div>`;
    const draw = () => {
      const rows = rowsFor(t);

      $$('[data-sort]', v).forEach((th) => th.addEventListener('click', () => { const k = th.dataset.sort; const s = ui.sort[t.name]; ui.sort[t.name] = { k, dir: s && s.k === k ? -s.dir : (t.fields.find((f) => f.k === k) && isNum(F(t, k)) ? -1 : 1) }; draw(); }));
      $$('[data-next]', v).forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); const r = S.db[t.name].find((x) => String(x.id) === b.dataset.next); r[t.statusF.k] = b.dataset.to; if (t.onStatus) t.onStatus(r, H); touch(); toast(`${val(t, r, t.titleF)} moved to ${b.dataset.to}`); draw(); }));
    };
    draw();
    $('.search input', v).addEventListener('input', (e) => { ui.q[t.name] = e.target.value; draw(); });
    $$('[data-st]', v).forEach((b) => b.addEventListener('click', () => { ui.status[t.name] = b.dataset.st; viewTable(v, m); }));
    $$('[data-view]', v).forEach((b) => b.addEventListener('click', () => { ui.view[t.name] = b.dataset.view; viewTable(v, m); }));
    const clr = $('[data-clear]', v); if (clr) clr.addEventListener('click', () => { ui.filter = null; viewTable(v, m); });
    const add = $('[data-add]', v); if (add) add.addEventListener('click', () => form(t, null));
    $('[data-csv]', v).addEventListener('click', () => csv(t, rowsFor(t)));
  }
  function listHTML(t, rows) {
    const cols = t.fields.filter((f) => !f.hide);
    if (!rows.length) return `<div class="card empty">${ic('search', 28)}<p>No ${esc(t.label.toLowerCase())} match. Try another search or filter.</p></div>`;
    const sum = cols.map((f) => f.type === 'money' && !t.noTotal ? rows.reduce((a, r) => a + (Number(val(t, r, f)) || 0), 0) : null);
    const s = ui.sort[t.name];
    const arrow = (k) => s && s.k === k ? (s.dir > 0 ? ' ↑' : ' ↓') : '';
    return `<div class="tw"><table class="rt"><thead><tr>${t.code ? `<th data-sort="id">Ref${arrow('id')}</th>` : ''}${cols.map((f) => `<th class="${isNum(f) ? 'n' : ''}" data-sort="${f.k}">${esc(f.label)}${arrow(f.k)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r) => `<tr data-open="${t.name}" data-id="${esc(r.id)}" tabindex="0">${t.code ? `<td class="ref" data-label="Ref">${esc(r.id)}</td>` : ''}${cols.map((f, i) => `<td class="${isNum(f) ? 'n' : ''}${f === t.titleF ? ' tt' : ''}" data-label="${esc(f.label)}">${cell(t, r, f)}</td>`).join('')}</tr>`).join('')}</tbody>
      ${sum.some((x) => x !== null) ? `<tfoot><tr>${t.code ? '<td></td>' : ''}${cols.map((f, i) => `<td class="${isNum(f) ? 'n' : ''}">${i === 0 && sum[0] === null ? `<b>${rows.length} total</b>` : sum[i] !== null ? `<b>${money(sum[i])}</b>` : ''}</td>`).join('')}</tr></tfoot>` : ''}
      </table></div><p class="muted small count">${rows.length} of ${rowsOf(t.name).length} ${esc(t.label.toLowerCase())}</p>`;
  }
  function boardHTML(t, rows, ro) {
    const opts = t.statusF.opts;
    const cardF = (t.card || t.fields.filter((f) => !f.hide && f !== t.titleF && f !== t.statusF).slice(0, 3).map((f) => f.k)).map((k) => F(t, k)).filter(Boolean);
    return `<div class="board">${opts.map((o, i) => {
      const rs = rows.filter((r) => val(t, r, t.statusF) === o.v);
      const nx = opts[i + 1];

        ${rs.map((r) => `<article class="bcard" data-open="${t.name}" data-id="${esc(r.id)}" tabindex="0">
          ${t.code ? `<span class="ref">${esc(r.id)}</span>` : ''}<b>${esc(val(t, r, t.titleF))}</b>
          ${cardF.map((f) => { const x = val(t, r, f); return x === '' || x == null ? '' : `<span class="bf">${esc(f.label)}: ${cell(t, r, f)}</span>`; }).join('')}
          ${!ro && nx ? `<button class="next" data-next="${esc(r.id)}" data-to="${esc(nx.v)}">${esc(nx.v)} ${ic('arrow', 14)}</button>` : ''}
        </article>`).join('') || '<p class="lane-empty">Nothing here</p>'}
      </section>`;
    }).join('')}</div>`;

  /* ---------- record detail ---------- */
  function detail(t, r, ro) {
    const acts = (t.actions || []).filter((a) => !ro && matchExpr(t, r, a[2]));
    const rel2 = (t.related || []).map(([tn, fk, title, cols]) => {
      const rt = T[tn]; const key = val(t, r, t.titleF);
      const rows = sorted(rt, rowsOf(tn).filter((x) => x[fk] === key || x[fk] === r.id)).slice(0, 8);
      return `<div class="rel"><h3>${esc(title)} <span class="muted small">(${rows.length})</span></h3>${miniTable(rt, rows, cols)}</div>`;
    }).join('');
    dlg(`<div class="dh"><div><span class="ref">${t.code ? esc(r.id) : esc(t.label)}</span><h2>${esc(val(t, r, t.titleF))}</h2></div>
        <div class="inline">${t.statusF ? pill(val(t, r, t.statusF), toneOf(t.statusF, val(t, r, t.statusF))) : ''}<button class="x" data-close aria-label="Close">${ic('x')}</button></div></div>
      <dl class="dl">${t.fields.filter((f) => f !== t.titleF).map((f) => `<div class="${f.type === 'area' ? 'wide' : ''}"><dt>${esc(f.label)}</dt><dd>${cell(t, r, f)}</dd></div>`).join('')}</dl>
      ${rel2}
      <div class="dact">${acts.map((a, i) => `<button class="btn" data-act="${i}">${esc(a[0])}</button>`).join('')}
        ${t.print ? `<button class="btn ghost" data-print>${ic('printer', 16)} ${esc(t.print)}</button>` : ''}
        ${!ro ? `<button class="btn ghost" data-edit>Edit</button><button class="btn ghost danger" data-del>Delete</button>` : ''}</div>`,
    (d) => {
      $$('[data-act]', d).forEach((b) => b.addEventListener('click', () => {
        const a = acts[+b.dataset.act];
        if (typeof a[1] === 'function') a[1](r, H);
        else a[1].split('&').forEach((p) => { const [k, x] = split1(p, '='); const rv = resolve(x, t, r); const f = F(t, k); r[k] = f && isNum(f) ? Number(rv) || 0 : rv; });
        if (t.onStatus) t.onStatus(r, H);
        touch(); d.close(); toast(a[3] || `${a[0]}: done`); render();
      }));
      const p = $('[data-print]', d); if (p) p.addEventListener('click', () => printRecord(t, r));
      const e = $('[data-edit]', d); if (e) e.addEventListener('click', () => { d.close(); form(t, r); });
      const del = $('[data-del]', d);
      if (del) del.addEventListener('click', () => {
        if (del.dataset.sure) { S.db[t.name] = S.db[t.name].filter((x) => x !== r); touch(); d.close(); toast(`${t.one[0].toUpperCase() + t.one.slice(1)} deleted`); render(); return; }
        del.dataset.sure = '1'; del.textContent = 'Tap again to delete'; del.classList.add('sure');
      });
      wireOpen(d);
    }, 'wide');
  }

  /* ---------- add / edit form ---------- */
  function optionsFor(f) {
    if (f.type === 'ref') { const [tn, fk] = f.opts[0].v.split('.'); return S.db[tn].map((r) => val(T[tn], r, fk || T[tn].titleF.k)); }
    return f.opts.map((o) => o.v);
  }
  function input(f, v, req) {
    const n = `name="${f.k}"`, rq = req ? ' required' : '';
    const vv = esc(v == null ? '' : v);
    let el;
    if (['sel', 'status', 'ref'].includes(f.type)) el = `<select ${n}${rq}>${f.type === 'ref' && !req ? '<option value=""></option>' : ''}${optionsFor(f).map((o) => `<option${String(o) === String(v) ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'area') el = `<textarea ${n} rows="3"${rq}>${vv}</textarea>`;
    else if (f.type === 'money' || f.type === 'num' || f.type === 'pct' || f.type === 'bar') el = `<input ${n} type="number" step="any" inputmode="decimal" value="${vv}"${rq}>`;
    else if (f.type === 'stars') el = `<select ${n}>${[5, 4, 3, 2, 1].map((x) => `<option value="${x}"${+v === x ? ' selected' : ''}>${'★'.repeat(x)}</option>`).join('')}</select>`;
    else el = `<input ${n} type="${{ date: 'date', time: 'time', email: 'email', tel: 'tel' }[f.type] || 'text'}" value="${vv}"${rq}${f.type === 'tel' ? ' inputmode="tel"' : ''}>`;
    return `<label class="${f.type === 'area' ? 'wide' : ''}"><span>${esc(f.label)}</span>${el}</label>`;
  }
  function dflt(t, f) {
    const d = t.defaults && t.defaults[f.k];
    if (d !== undefined) return resolve(d, t, {});
    if (f.type === 'status' || f.type === 'sel' || f.type === 'stars') return f.type === 'stars' ? 5 : (f.opts[0] || {}).v;
    if (f.type === 'ref') return optionsFor(f)[0];
    if (f === t.dateF) return todayS;
    return '';
  }
  function form(t, r) {
    const isNew = !r;
    const fs = t.fields.filter((f) => !f.calc && !(t.noForm || []).includes(f.k));
    dlg(`<form class="frm" novalidate><div class="dh"><h2>${isNew ? esc(t.addLabel || 'Add ' + t.one) : 'Edit ' + esc(t.one)}</h2><button type="button" class="x" data-close aria-label="Close">${ic('x')}</button></div>
      <div class="fgrid">${fs.map((f, i) => input(f, r ? r[f.k] : dflt(t, f), i === 0)).join('')}</div>
      <p class="err" hidden></p>
      <div class="dact"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">${isNew ? 'Save' : 'Save changes'}</button></div></form>`,
    (d) => $('form', d).addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target), vals = {};
      fs.forEach((f) => { const x = fd.get(f.k); vals[f.k] = isNum(f) || f.type === 'stars' ? (x === '' || x == null ? '' : Number(x)) : (x == null ? '' : String(x).trim()); });
      if (vals[fs[0].k] === '') { const er = $('.err', d); er.hidden = false; er.textContent = `${fs[0].label} is needed.`; return; }
      if (isNew) {
        S.seq[t.name] = (S.seq[t.name] || 0) + 1;
        const o = Object.assign({ id: makeId(t, S.seq[t.name]) }, vals);
        S.db[t.name].unshift(o);
        if (t.onAdd) t.onAdd(o, H);
      } else { Object.assign(r, vals); if (t.onStatus) t.onStatus(r, H); }
      touch(); d.close();
      toast(isNew ? `${t.one[0].toUpperCase() + t.one.slice(1)} saved` : 'Changes saved');
      render();
    }), 'wide');
  }

  /* ---------- printing & CSV ---------- */
  const printHead = (title) => `<div class="ph">${logo(44)}<div><b>${esc(C.org.name)}</b><span>${esc(C.org.place)}${C.org.phone ? ' · ' + esc(C.org.phone) : ''}</span></div><h2>${esc(title)}</h2></div>`;
  const printFoot = () => `<p class="pf">Printed ${dfmt(todayS)} from ${esc(C.name)} · Built by Nexora Digital · nexoradigitalzim.com</p>`;
  function doPrint(html) {
    const p = $('#printdoc'); p.innerHTML = html;
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); p.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(done, 500); }, 50);
  }
  function printRecord(t, r) {
    doPrint(`${printHead(t.print.replace(/^Print\s+/i, ''))}<div class="pmeta"><span>Ref <b>${esc(r.id)}</b></span><span>Date <b>${dfmt(t.dateF ? val(t, r, t.dateF) : todayS)}</b></span></div>
      <table class="ptab"><tbody>${t.fields.map((f) => `<tr><th>${esc(f.label)}</th><td>${cell(t, r, f)}</td></tr>`).join('')}</tbody></table>${printFoot()}`);
  }
  function csv(t, rows) {
    const fs = t.fields;
    const q = (x) => `"${String(x == null ? '' : x).replace(/"/g, '""')}"`;
    const lines = [['Ref', ...fs.map((f) => f.label)].map(q).join(','), ...rows.map((r) => [r.id, ...fs.map((f) => val(t, r, f))].map(q).join(','))];
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `${C.id}-${t.name}-${todayS}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    toast(`${rows.length} rows downloaded`);
  }

  /* ---------- point of sale ---------- */
  function viewPOS(v, m) {
    const t = T[m.items], st = T[m.sales];
    const cart = ui.cart[m.k] = ui.cart[m.k] || {};
    const cats = m.cat ? ['All', ...new Set(S.db[t.name].map((r) => r[m.cat]))] : null;
    const cat = ui.cart[m.k + ':cat'] || 'All';
    v.innerHTML = `<div class="pos"><section>
        <div class="toolbar"><label class="search">${ic('search', 16)}<input type="search" placeholder="Search or scan a code" aria-label="Search products" value="${esc(ui.q[m.k] || '')}"></label>
        ${cats ? `<div class="chips">${cats.map((c) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('')}</div>` : ''}</div>
        <div class="pgrid" id="pgrid"></div></section>
      <aside class="card cart" id="cart"></aside></div>`;
    const drawGrid = () => {
      const q = (ui.q[m.k] || '').toLowerCase();
      const items = S.db[t.name].filter((r) => (cat === 'All' || r[m.cat] === cat) && (!q || JSON.stringify(r).toLowerCase().includes(q)));
      $('#pgrid', v).innerHTML = items.map((r) => {
        const stock = m.stock ? Number(r[m.stock]) : Infinity;
        const low = m.reorder ? stock <= Number(r[m.reorder]) : stock <= 5;
        return `<button class="pitem" data-pi="${esc(r.id)}" ${stock <= 0 ? 'disabled' : ''}>
          <span class="pcat">${esc(m.cat ? r[m.cat] : '')}</span><b>${esc(r[m.name])}</b>
          <span class="pp">${money(r[m.price])}</span>
          ${m.stock ? `<span class="ps ${stock <= 0 ? 'bad' : low ? 'warn' : ''}">${stock <= 0 ? 'Out of stock' : num(stock) + ' in stock'}</span>` : ''}</button>`;
      }).join('') || '<p class="muted">Nothing matches.</p>';
      $$('[data-pi]', v).forEach((b) => b.addEventListener('click', () => {
        const r = S.db[t.name].find((x) => String(x.id) === b.dataset.pi);
        const q2 = (cart[r.id] || 0) + 1;
        if (m.stock && q2 > Number(r[m.stock])) return toast(`Only ${r[m.stock]} in stock`, true);
        cart[r.id] = q2; drawCart();
      }));
    };
    const lines = () => Object.entries(cart).map(([id, q]) => ({ r: S.db[t.name].find((x) => String(x.id) === id), q })).filter((l) => l.r);
    const drawCart = () => {
      const ls = lines(); const total = ls.reduce((a, l) => a + l.q * Number(l.r[m.price]), 0);
      $('#cart', v).innerHTML = `<div class="cardhead"><h3>${esc(m.cartTitle || 'Current sale')}</h3>${ls.length ? '<button class="link" data-clr>Clear</button>' : ''}</div>
        ${ls.length ? ls.map((l) => `<div class="cline"><div><b>${esc(l.r[m.name])}</b><small>${money(l.r[m.price])} each</small></div>
          <div class="qty"><button data-dq="${esc(l.r.id)}" aria-label="One less">−</button><b>${l.q}</b><button data-iq="${esc(l.r.id)}" aria-label="One more">+</button></div><span class="lt">${money(l.q * l.r[m.price])}</span></div>`).join('') : `<div class="cart-empty">${ic('cart', 30)}<p>Tap items to add them</p></div>`}
        <div class="ctotal"><span>Total</span><b>${money(total)}</b></div>
        ${m.extra ? `<label><span>${esc(m.extra.label)}</span><select id="pxtra">${m.extra.opts.map((o) => `<option>${esc(o)}</option>`).join('')}</select></label>` : ''}
        <label><span>Customer (optional)</span><input id="pcust" placeholder="Name or phone"></label>
        <div class="methods" role="radiogroup" aria-label="Payment method">${(m.methods || ['Cash', 'EcoCash', 'Card']).map((x, i) => `<label class="mth"><input type="radio" name="pm" value="${esc(x)}" ${i ? '' : 'checked'}><span>${esc(x)}</span></label>`).join('')}</div>
        <button class="btn big" data-pay ${ls.length ? '' : 'disabled'}>${ic('check', 18)} ${esc(m.payLabel || 'Complete sale')} · ${money(total)}</button>`;
      const c = $('#cart', v);
      $$('[data-iq]', c).forEach((b) => b.addEventListener('click', () => { const r = S.db[t.name].find((x) => String(x.id) === b.dataset.iq); if (m.stock && cart[r.id] + 1 > Number(r[m.stock])) return toast(`Only ${r[m.stock]} in stock`, true); cart[r.id]++; drawCart(); }));
      $$('[data-dq]', c).forEach((b) => b.addEventListener('click', () => { cart[b.dataset.dq]--; if (cart[b.dataset.dq] <= 0) delete cart[b.dataset.dq]; drawCart(); }));
      const clr = $('[data-clr]', c); if (clr) clr.addEventListener('click', () => { Object.keys(cart).forEach((k) => delete cart[k]); drawCart(); });
      const pay = $('[data-pay]', c);
      pay.addEventListener('click', () => {
        const method = ($('input[name="pm"]:checked', c) || {}).value;
        const cust = $('#pcust', c).value.trim();
        const extra = m.extra ? $('#pxtra', c).value : '';
        S.seq[st.name] = (S.seq[st.name] || 0) + 1;
        const row = { id: makeId(st, S.seq[st.name]) };
        const data = { date: todayS, time: nowT(), items: ls.map((l) => `${l.q}× ${l.r[m.name]}`).join(', '), qty: ls.reduce((a, l) => a + l.q, 0), total, method, cashier: role.person, customer: cust || 'Walk-in' };
        if (m.extra) data[m.extra.k] = extra;
        st.fields.forEach((f) => { if (!f.calc) row[f.k] = f.k in data ? data[f.k] : f.type === 'status' ? (m.saleStatus || f.opts[0].v) : ''; });
        S.db[st.name].unshift(row);
        if (m.stock) ls.forEach((l) => { l.r[m.stock] = Number(l.r[m.stock]) - l.q; });
        touch();
        Object.keys(cart).forEach((k) => delete cart[k]);
        drawGrid(); drawCart(); render2Bell();
        dlg(`<div class="receipt"><div class="rc-h">${logo(40)}<b>${esc(C.org.name)}</b><small>${esc(C.org.place)}</small></div>
          <p class="rc-m"><span>${esc(row.id)}</span><span>${dfmt(todayS)} ${data.time}</span></p>
          ${ls.map((l) => `<p class="rc-l"><span>${l.q} × ${esc(l.r[m.name])}</span><span>${money(l.q * l.r[m.price])}</span></p>`).join('')}
          <p class="rc-t"><span>Total</span><span>${money(total)}</span></p><p class="rc-m"><span>Paid by ${esc(method)}</span><span>${esc(role.person)}</span></p>
          ${m.extra ? `<p class="rc-m"><span>${esc(m.extra.label)}</span><span>${esc(extra)}</span></p>` : ''}
          <p class="rc-f">Thank you! · Powered by ${esc(C.name)}</p></div>
          <div class="dact"><button class="btn ghost" data-rp>${ic('printer', 16)} Print receipt</button><button class="btn" data-close>New sale</button></div>`,
        (d) => $('[data-rp]', d).addEventListener('click', () => doPrint($('.receipt', d).outerHTML)), 'narrow');
      });
    };
    drawGrid(); drawCart();
    $('.search input', v).addEventListener('input', (e) => { ui.q[m.k] = e.target.value; drawGrid(); });
    $$('[data-cat]', v).forEach((b) => b.addEventListener('click', () => { ui.cart[m.k + ':cat'] = b.dataset.cat; viewPOS(v, m); }));
  }
  function render2Bell() { const n = alertsList().length, bn = $('#bellN'); if (bn) { bn.hidden = !n; bn.textContent = n; } }

  /* ---------- agenda ---------- */
  function viewAgenda(v, m) {
    const t = T[m.table], n = m.days || 7;
    const ds = Array.from({ length: n }, (_, i) => addDays(i + ui.ag));
    const ro = m.ro;
    v.innerHTML = `<div class="phead"><div class="inline"><button class="iconbtn" data-ag="-${n}" aria-label="Earlier">${ic('chevL')}</button><b>${dfmt(ds[0])} – ${dfmt(ds[n - 1])}</b><button class="iconbtn" data-ag="${n}" aria-label="Later">${ic('chevR')}</button>${ui.ag ? '<button class="link" data-ag="0">Today</button>' : ''}</div>
      ${ro ? '' : `<button class="btn" data-add>${ic('plus', 16)} ${esc(t.addLabel || 'Add ' + t.one)}</button>`}</div>
      <div class="agenda">${ds.map((d) => {
        const items = rowsOf(t.name).filter((r) => r[m.date] === d).sort((a, b) => String(a[m.time] || '').localeCompare(String(b[m.time] || '')));
        const dd = parseD(d);
        return `<section class="day${d === todayS ? ' today' : ''}"><h3><span>${WD[dd.getDay()]}</span><b>${dd.getDate()}</b><small>${MON[dd.getMonth()]}</small>${items.length ? `<i>${items.length}</i>` : ''}</h3>
          ${items.map((r) => `<article class="ev" data-open="${t.name}" data-id="${esc(r.id)}" tabindex="0"><span class="et">${esc(r[m.time] || '')}</span><b>${esc(val(t, r, m.title))}</b><small>${esc(m.sub ? val(t, r, m.sub) : '')}</small>${t.statusF ? pill(val(t, r, t.statusF), toneOf(t.statusF, val(t, r, t.statusF))) : ''}</article>`).join('') || '<p class="lane-empty">Free</p>'}</section>`;
      }).join('')}</div>`;
    $$('[data-ag]', v).forEach((b) => b.addEventListener('click', () => { const x = +b.dataset.ag; ui.ag = x === 0 ? 0 : ui.ag + x; viewAgenda(v, m); }));
    const add = $('[data-add]', v); if (add) add.addEventListener('click', () => form(t, null));
    wireOpen(v);
  }

  /* ---------- reports ---------- */
  function viewReports(v) {
    const tabs = role.mods.map((x) => T[x.k] || (C.modules && C.modules[x.k] && T[C.modules[x.k].table || C.modules[x.k].sales])).filter(Boolean).filter((t, i, a) => a.indexOf(t) === i);
    if (!tabs.length) { v.innerHTML = '<p class="muted">No reports for this role.</p>'; return; }
    if (!ui.rep.table || !tabs.some((t) => t.name === ui.rep.table)) ui.rep.table = (tabs.find((t) => t.dateF) || tabs[0]).name;
    const t = T[ui.rep.table];
    const R = { month: ['This month', todayS.slice(0, 8) + '01'], d30: ['Last 30 days', addDays(-30)], quarter: ['Last 90 days', addDays(-90)], year: ['This year', todayS.slice(0, 5) + '01-01'], all: ['All time', ''] };
    const from = R[ui.rep.range][1];
    const rows = sorted(t, rowsOf(t.name).filter((r) => !t.dateF || !from || String(val(t, r, t.dateF) || '') >= from));
    const moneyF = t.fields.filter((f) => f.type === 'money');
    const groupF = [t.statusF, ...t.fields.filter((f) => (f.type === 'sel' || f.type === 'ref' || f.type === 'tag') && f !== t.statusF)].filter(Boolean).slice(0, 2);
    const breakdown = (gf) => { const mp = new Map(); rows.forEach((r) => { const g = val(t, r, gf) || '—'; const o = mp.get(g) || { n: 0, s: 0 }; o.n++; if (moneyF[0]) o.s += Number(val(t, r, moneyF[0])) || 0; mp.set(g, o); }); return [...mp.entries()].sort((a, b) => b[1].n - a[1].n); };
    const cols = t.fields.filter((f) => !f.hide).slice(0, 7);
    v.innerHTML = `<div class="phead noprint"><div class="rsel">
        <label><span>Report on</span><select id="rt">${tabs.map((x) => `<option value="${x.name}"${x === t ? ' selected' : ''}>${esc(x.label)}</option>`).join('')}</select></label>
        <label><span>Period</span><select id="rr">${Object.entries(R).map(([k, x]) => `<option value="${k}"${k === ui.rep.range ? ' selected' : ''}>${x[0]}</option>`).join('')}</select></label></div>
        <div class="acts"><button class="btn ghost" data-csv>${ic('download', 16)} CSV</button><button class="btn" data-pr>${ic('printer', 16)} Print or save PDF</button></div></div>
      <div id="report"><div class="print-only">${printHead(t.label + ' report')}</div>
      <p class="muted rmeta">${esc(t.label)} · ${R[ui.rep.range][0]}${t.dateF ? ` (by ${esc(t.dateF.label.toLowerCase())})` : ''} · generated ${dfmt(todayS)} by ${esc(role.person)}</p>
      <div class="kpis sm"><div class="kpi"><span>Records</span><b>${rows.length}</b></div>${moneyF.slice(0, 3).map((f) => `<div class="kpi"><span>Total ${esc(f.label.toLowerCase())}</span><b>${moneyS(rows.reduce((a, r) => a + (Number(val(t, r, f)) || 0), 0))}</b></div>`).join('')}</div>
      <div class="charts">${groupF.map((gf) => { const b = breakdown(gf); const mx = Math.max(1, ...b.map((x) => x[1].n)); return `<div class="card chart"><h3>By ${esc(gf.label.toLowerCase())}</h3><div class="bars">${b.slice(0, 8).map(([g, o]) => `<div class="brow"><span class="bl">${esc(g)}</span><span class="bt"><i style="width:${(o.n / mx) * 100}%"></i></span><span class="bv">${o.n}${moneyF[0] ? ' · ' + moneyS(o.s) : ''}</span></div>`).join('')}</div></div>`; }).join('')}</div>
      <div class="card"><h3>Detail</h3>${rows.length ? `<div class="tw mini"><table><thead><tr>${t.code ? '<th>Ref</th>' : ''}${cols.map((f) => `<th class="${isNum(f) ? 'n' : ''}">${esc(f.label)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0, 200).map((r) => `<tr>${t.code ? `<td class="ref" data-label="Ref">${esc(r.id)}</td>` : ''}${cols.map((f) => `<td class="${isNum(f) ? 'n' : ''}" data-label="${esc(f.label)}">${cell(t, r, f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '<p class="muted">No records in this period.</p>'}</div>
      <div class="print-only">${printFoot()}</div></div>`;
    $('#rt', v).addEventListener('change', (e) => { ui.rep.table = e.target.value; viewReports(v); });
    $('#rr', v).addEventListener('change', (e) => { ui.rep.range = e.target.value; viewReports(v); });
    $('[data-csv]', v).addEventListener('click', () => csv(t, rows));
    $('[data-pr]', v).addEventListener('click', () => doPrint($('#report', v).innerHTML.replace(/class="print-only"/g, 'class=""')));
  }

  /* ---------- boot ---------- */
  load();
  applyTheme();
  setFavicon();
  role = C.roles.find((r) => r.id === S.role) || null;
  if (role) { shell(); go(location.hash.slice(1) || role.mods[0].k); } else login();
  window.addEventListener('hashchange', () => { if (role && location.hash.slice(1) !== curMod) go(location.hash.slice(1)); });
})();
</script>
</body>
</html>
